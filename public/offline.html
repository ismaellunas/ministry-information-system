<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>West Section MIS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        color: #1e2939;
        font-family: Outfit, system-ui, sans-serif;
        padding: calc(2rem + env(safe-area-inset-top)) 1rem calc(2rem + env(safe-area-inset-bottom));
      }
      main { width: 100%; max-width: 24rem; }
      h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; color: #101828; }
      p { margin: 1rem 0 0; font-size: 14px; line-height: 20px; color: #6a7282; }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-height: 44px;
        margin-top: 1rem;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      .primary { background: #465fff; color: #fff; }
      .secondary { background: #fff; color: #344054; border: 1px solid #d0d5dd; }
    </style>
  </head>
  <body>
    <main>
      <h1>West MIS</h1>
      <p>The calendar opens after this phone has loaded it once.</p>
      <a class="primary" href="/calendar">Calendar</a>
      <a class="secondary" href="/login">Sign in</a>
    </main>
  </body>
</html>
